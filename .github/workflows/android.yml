name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/app/**", "android/*.gradle", ".github/workflows/android.yml"]

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Create the upload key the first time (needs the ANDROID_KEYSTORE_PASSWORD secret)
        run: |
          if [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ ! -f android/upload.p12 ]; then
            keytool -genkeypair -keystore android/upload.p12 -storetype PKCS12 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=DailyTwist, O=DailyTwist, C=MA"
            echo "::warning::Created a new upload key (android/upload.p12)"
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::warning::No ANDROID_KEYSTORE_PASSWORD secret yet: building the test APK only."
          fi

      - name: Build
        working-directory: android
        run: |
          TASKS="assembleDebug"
          if [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then TASKS="$TASKS bundleRelease"; fi
          set -o pipefail
          if ! gradle $TASKS --no-daemon --stacktrace 2>&1 | tee build.log; then
            grep -E "error:|What went wrong|Could not|FAILURE|> " build.log | head -40 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Save fingerprints for the website (Digital Asset Links)
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          fps = []
          def fp(store, pw, alias, typ=None):
              cmd = ["keytool", "-list", "-v", "-keystore", store, "-storepass", pw, "-alias", alias]
              if typ: cmd += ["-storetype", typ]
              out = subprocess.run(cmd, capture_output=True, text=True).stdout
              m = re.search(r"SHA256:\s*([0-9A-F:]+)", out)
              return m.group(1) if m else None
          fps.append(fp("android/debug.keystore", "android", "androiddebugkey"))
          pw = os.environ.get("ANDROID_KEYSTORE_PASSWORD")
          if pw and os.path.exists("android/upload.p12"):
              fps.append(fp("android/upload.p12", pw, "upload", "pkcs12"))
          json.dump([f for f in fps if f], open("android/fingerprints.json", "w"), indent=1)
          print(open("android/fingerprints.json").read())
          PY

      - name: Commit key + fingerprints
        run: |
          git config user.name "dailytwist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add android/fingerprints.json android/upload.p12 2>/dev/null || git add android/fingerprints.json
          if ! git diff --cached --quiet; then
            git commit -m "Android signing fingerprints"
            git pull --rebase origin main
            git push
          fi

      - name: Publish the files as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/DailyTwist-test.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab out/DailyTwist-googleplay.aab
          fi
          gh release create "app-v${VERSION_CODE}" out/* --title "DailyTwist app v1.0.${VERSION_CODE}" \
            --notes "DailyTwist-test.apk: install on your phone to try the app. DailyTwist-googleplay.aab: upload to Google Play Console." --latest
