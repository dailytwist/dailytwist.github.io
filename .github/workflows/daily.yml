name: Daily AI agent + publish

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC (= 06:17 Morocco)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "How many past days to fill (use 14-21 the first time)"
        required: false
        default: "0"
  push:
    branches: [main]
    paths: ["config.json", "site_builder/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: AI agent writes today's content
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent/run_daily.py --backfill "${{ github.event.inputs.backfill_days || 0 }}"

      - name: Save new content to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "dailytwist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || git commit -m "Daily content $(date -u +%F)"
          git push

      - name: Build website
        run: python site_builder/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
