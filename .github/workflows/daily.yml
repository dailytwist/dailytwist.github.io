name: Daily AI agent + publish

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC: today's horoscopes/trivia early, using what is left of yesterday's free AI quota
    - cron: "23 8 * * *"   # 08:23 UTC: just after Google resets the free Gemini quota
    - cron: "23 19 * * *"  # 19:23 UTC: continue the backlog (guides, lessons, translations)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "How many past days to fill (use 5 the first time on the free plan)"
        required: false
        default: "0"
  push:
    branches: [main]
    paths: ["config.json", "site_builder/**", "android/fingerprints.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: AI agent writes today's content
        if: github.event_name != 'push'
        timeout-minutes: 140
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent/run_daily.py --backfill "${{ github.event.inputs.backfill_days || 0 }}"

      - name: Save new content to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "dailytwist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || git commit -m "Daily content $(date -u +%F)"
          git pull --rebase origin main
          git push

      - name: Build website
        run: python site_builder/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Tell search engines about new pages (IndexNow)
        continue-on-error: true
        run: |
          sleep 60
          git config user.name "dailytwist-bot"
          git config user.email "bot@users.noreply.github.com"
          python agent/indexnow.py
          git add content/indexnow_sent.json
          if ! git diff --cached --quiet; then git commit -m "IndexNow $(date -u +%F)"; git pull --rebase origin main; git push; fi

      - name: Post today's highlights to Telegram
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python agent/telegram_post.py
          git add content
          if ! git diff --cached --quiet; then git commit -m "Telegram post $(date -u +%F)"; git pull --rebase origin main; git push; fi
