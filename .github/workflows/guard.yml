name: Guard (site security check)

on:
  schedule:
    - cron: "40 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check site, domain and repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python agent/guard.py
