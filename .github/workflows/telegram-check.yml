name: Telegram check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the Telegram token (never prints it)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python agent/telegram_post.py --check && python agent/telegram_post.py --welcome
